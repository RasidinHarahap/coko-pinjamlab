{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.7"/>
{% elif name == 'box' %}<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/>
{% elif name == 'arrows' %}<path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18M8 15h2m4 0h2m-8 3h2"/>
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 2.8 7M3 5v6h6m3-4v5l3 2"/>
{% elif name == 'leaf' %}<path d="M19 4C8 3 4 8 6 15c7 3 13-1 13-11ZM4 20 15 9"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow-right' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'arrow-left' %}<path d="M20 12H4m6-6-6 6 6 6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'check-circle' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>
{% elif name == 'edit' %}<path d="m16 3 5 5-12 12H4v-5L16 3Zm-3 3 5 5"/>
{% elif name == 'trash' %}<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>
{% elif name == 'receipt' %}<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3ZM9 7h6m-6 4h6m-6 4h3"/>
{% elif name == 'print' %}<path d="M6 8V3h12v5M6 17H3V9h18v8h-3M6 14h12v7H6v-7Zm11-3h1"/>
{% endif %}</svg>
{%- endmacro %}
{% macro badge(status) -%}<span class="badge {{ 'badge-good' if status in ['Dikembalikan','Tersedia','Baik'] else 'badge-warn' if status in ['Terlambat','Dalam perawatan','Baik dengan catatan'] else 'badge-muted' if status in ['Rusak','Tidak dapat dipinjam'] else 'badge-blue' }}"><span class="status-dot"></span>{{ status }}</span>{%- endmacro %}
