name: PinjamLab v5 - Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Flask, SQLite, Docker and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate an ephemeral local-only test key
        run: |
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "APP_PORT=18080" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image and start a healthy container
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Check HTTP health and server status
        run: |
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:18080/health

      - name: Run isolated SQLite checks (7)
        run: docker compose exec -T web python scripts/test_sqlite_integrity.py

      - name: Run business-rule tests (8)
        run: docker compose exec -T web python scripts/test_rules.py

      - name: Run Flask and SQLite integration tests (27)
        run: docker compose exec -T web python scripts/test_app.py

      - name: Run HTTP smoke tests (13)
        run: docker compose exec -T web python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Confirm database survives container recreation
        run: |
          marker="PERSIST-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose exec -T web python scripts/persistence_probe.py create "$marker"
          docker compose up -d --force-recreate --wait --wait-timeout 180
          docker compose exec -T web python scripts/persistence_probe.py verify "$marker"
          docker compose exec -T web python scripts/persistence_probe.py cleanup "$marker"

      - name: Report Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 web

      - name: Stop container without deleting persistent volume
        if: always()
        run: docker compose down
